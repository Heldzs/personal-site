<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo escuro (cor zinc-900 do Tailwind) com bordas arredondadas -->
  <rect width="512" height="512" rx="120" fill="#18181B"/>
  
  <!-- Letras HJ centralizadas e em negrito, cor clara (zinc-50) -->
  <text 
    x="50%" 
    y="50%" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="220" 
    fill="#FAFAFA" 
    text-anchor="middle" 
    dominant-baseline="central" 
    letter-spacing="-10"
  >
    HJ
  </text>
</svg>
